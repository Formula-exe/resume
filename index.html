    function initMotion(){
      const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.resumeRevealObserver?.disconnect();
      const groups=[
        ['#highlights .section-kicker,#highlights h2',0],['#metrics .metric',1],

        ['#credentials .section-kicker,#credentials h2,#gallery',0]
      ];
      const targets=[];
      groups.forEach(([selector,base])=>document.querySelectorAll(selector).forEach((node,index)=>{
        node.classList.add('reveal');node.dataset.revealDelay=String(Math.min(base+index,3));targets.push(node);
      }));
      if(reduced){targets.forEach(node=>node.classList.add('is-visible'));return}
      window.resumeRevealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
        if(entry.isIntersecting){entry.target.classList.add('is-visible');window.resumeRevealObserver.unobserve(entry.target)}
      }),{threshold:.14,rootMargin:'0px 0px -36px'});
      targets.forEach(node=>window.resumeRevealObserver.observe(node));
    }
